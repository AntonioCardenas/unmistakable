name: False positive
description: The scanner flagged something that is a deliberate, correct choice.
title: "[False positive] UNM-"
labels: ["false-positive"]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: UNM-41
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal snippet that triggers it
      render: html
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why this usage is correct
      description: Brand requirement, data encoding, accessibility need, or something else?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Scanner version
      description: Output of `python3 scripts/detect_slop.py --version`
